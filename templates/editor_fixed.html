// ============ 属性应用函数 ============
function applyProp(propName, value) {
  if (!canvas) return;
  const obj = canvas.getActiveObject();
  if (!obj) return;

  if (propName === 'left' || propName === 'top') {
    obj.set(propName, parseFloat(value));
  } else if (propName === 'width' || propName === 'height') {
    obj.set(propName, parseFloat(value));
  } else if (propName === 'angle') {
    obj.set('angle', parseFloat(value) % 360);
  } else if (propName === 'opacity') {
    obj.set('opacity', Math.max(0, Math.min(1, parseFloat(value))));
  } else if (propName === 'strokeWidth') {
    obj.set(propName, Math.max(0, parseFloat(value) || 0));
  } else if (propName === 'rx' || propName === 'ry' || propName === 'fill' || propName === 'stroke') {
    obj.set(propName, value);
  }

  obj.setCoords();
  canvas.renderAll();
  pushHistory();
  scheduleAutoSave();
}

function applyImageClipType(value) {
  if (!canvas) return;
  const obj = canvas.getActiveObject();
  if (!obj || obj.type !== 'image') return;

  obj.set('clipType', value);
  const rxGroup = document.getElementById('imageRxGroup');

  if (value === 'rounded-rect') {
    if (!obj.rx || obj.rx === 0) {
      obj.set('rx', 15);
      obj.set('ry', 15);
      const rxSlider = document.getElementById('propRx');
      const rxLabel = document.getElementById('propRxVal');
      if (rxSlider) rxSlider.value = 15;
      if (rxLabel) rxLabel.textContent = '15px';
    }
    if (rxGroup) rxGroup.style.display = 'block';
  } else {
    obj.set('rx', 0);
    obj.set('ry', 0);
    if (rxGroup) rxGroup.style.display = 'none';
  }

  updateImageClipPath(obj);
  canvas.renderAll();
  pushHistory();
  scheduleAutoSave();
}

function applyImageRx(value) {
  if (!canvas) return;
  const obj = canvas.getActiveObject();
  if (!obj || obj.type !== 'image') return;

  obj.set('rx', value);
  obj.set('ry', value);
  updateImageClipPath(obj);
  canvas.renderAll();
  pushHistory();
  scheduleAutoSave();
}

function applySlideBackground(value) {
  const slide = slidesData.slides.find(s => s.id === selectedSlideId);
  if (!slide) return;

  const oldBg = getSlideActualBgColor(slide);
  const oldIsDark = isDarkColor(oldBg);

  slide.backgroundColor = value || getThemeBgColor(slide.theme);
  const newBg = getSlideActualBgColor(slide);
  const newIsDark = isDarkColor(newBg);

  setCanvasBackground(slide.backgroundColor);

  // If the background darkness changed, adjust existing text/icon elements that use default colors
  if (canvas && oldIsDark !== newIsDark) {
    const oldDefaultColor = oldIsDark ? '#ffffff' : '#0a0a0a';
    const newDefaultColor = newIsDark ? '#ffffff' : '#0a0a0a';
    
    let changed = false;
    canvas.getObjects().forEach(obj => {
      if (obj.type === 'i-text' || obj.type === 'textbox') {
        if (obj.fill === oldDefaultColor) {
          obj.set('fill', newDefaultColor);
          obj.dirty = true;
          changed = true;
        }
      }
    });
    
    if (changed) {
      canvas.renderAll();
      updatePropsPanel();
    }
  }

  pushHistory();
  scheduleAutoSave();
}

function applySlideLayout(value) {
  const slide = slidesData.slides.find(s => s.id === selectedSlideId);
  if (!slide) return;

  if (value === 'body') {
    // 如果幻灯片当前本来就是 S01-S22 正文版式，就保留原有的，否则默认设为 S03
    if (!/^S\d+$/.test(slide.layout)) {
      slide.layout = 'S03';
    }
  } else {
    slide.layout = value;
  }
  renderSlideList();
  pushHistory();
  scheduleAutoSave();
}

function applyScaleSize(dim, value) {
  if (!canvas) return;
  const obj = canvas.getActiveObject();
  if (!obj) return;

  const newVal = Math.max(1, parseFloat(value));
  const currentScale = dim === 'width' ? (obj.scaleX || 1) : (obj.scaleY || 1);
  const baseSize = dim === 'width' ? obj.width : obj.height;
  const newScale = newVal / baseSize;

  if (dim === 'width') {
    obj.set('scaleX', newScale);
  } else {
    obj.set('scaleY', newScale);
  }

  obj.setCoords();
  canvas.renderAll();
  pushHistory();
  scheduleAutoSave();
}


function applyTextProp(propName, value, shouldPushHistory = true) {
  if (!canvas) return;
  const obj = canvas.getActiveObject();
  if (!obj || (obj.type !== 'i-text' && obj.type !== 'textbox')) return;

  const characterStyles = ['fontFamily', 'fontSize', 'fill', 'fontWeight', 'fontStyle'];

  if (obj.isEditing && characterStyles.includes(propName)) {
    obj.setSelectionStyles({ [propName]: value });
  } else {
    obj.set(propName, value);
  }

  obj.setCoords();
  canvas.renderAll();
  if (shouldPushHistory) {
    pushHistory();
  }
  scheduleAutoSave();
}

function toggleTextStyle(propName, activeVal, inactiveVal, btnEl) {
  if (!canvas) return;
  const obj = canvas.getActiveObject();
  if (!obj || (obj.type !== 'i-text' && obj.type !== 'textbox')) return;

  let current;
  if (obj.isEditing) {
    const selectionStyles = obj.getSelectionStyles();
    const firstStyle = (selectionStyles && selectionStyles.length > 0) ? selectionStyles[0] : null;
    if (firstStyle && firstStyle[propName] !== undefined) {
      current = firstStyle[propName];
    } else {
      current = obj.get(propName);
    }
  } else {
    current = obj.get(propName);
  }

  const newVal = current === activeVal ? inactiveVal : activeVal;

  if (obj.isEditing) {
    obj.setSelectionStyles({ [propName]: newVal });
  } else {
    obj.set(propName, newVal);
  }

  obj.setCoords();
  canvas.renderAll();

  if (btnEl) {
    btnEl.classList.toggle('active', newVal === activeVal);
  }

  pushHistory();
  scheduleAutoSave();
}

function refreshAlignButtons(align) {
  document.querySelectorAll('.toggle-group .toggle-btn').forEach(btn => {
    const txt = btn.textContent.trim();
    if (txt === '左') btn.classList.toggle('active', align === 'left');
    if (txt === '中') btn.classList.toggle('active', align === 'center');
    if (txt === '右') btn.classList.toggle('active', align === 'right');
  });
}

function duplicateSelectedElement() {
  if (!canvas) return;
  const activeObj = canvas.getActiveObject();
  if (!activeObj) return;

  activeObj.clone(function(clonedObj) {
    canvas.discardActiveObject();
    clonedObj.set({
      left: clonedObj.left + 15,
      top: clonedObj.top + 15,
      evented: true
    });

    if (clonedObj.type === 'activeSelection') {
      clonedObj.canvas = canvas;
      clonedObj.forEachObject(function(obj) {
        obj.id = 'elem-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
        if (obj.type === 'image') {
          updateImageClipPath(obj);
        }
        canvas.add(obj);
      });
      clonedObj.setCoords();
      canvas.setActiveObject(clonedObj);
    } else {
      clonedObj.id = 'elem-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
      if (clonedObj.type === 'image') {
        updateImageClipPath(clonedObj);
      }
      canvas.add(clonedObj);
      canvas.setActiveObject(clonedObj);
    }
    canvas.requestRenderAll();
    pushHistory();
    scheduleAutoSave();
  }, ['id', 'rx', 'ry', 'clipType', 'locked', 'elementType', 'html', 'css', 'meta']);
}

function toggleSelectedLock() {
  if (!canvas) return;
  const obj = canvas.getActiveObject();
  if (!obj) return;

  applyObjectLock(obj, !obj.lockMovementX);
  obj.setCoords();
  canvas.renderAll();
  updatePropsPanel();
  pushHistory();
  scheduleAutoSave();
}

// 图层操作
function layerAction(action) {
  if (!canvas) return;
  const obj = canvas.getActiveObject();
  if (!obj) return;

  switch (action) {
    case 'bringToFront': canvas.bringToFront(obj); break;
    case 'bringForward': canvas.bringForward(obj); break;
    case 'sendBackwards': canvas.sendBackwards(obj); break;
    case 'sendToBack': canvas.sendToBack(obj); break;
  }

  canvas.renderAll();
  pushHistory();
  scheduleAutoSave();
}

// 删除选中元素
function deleteSelectedElement() {
  if (!canvas) return;
  const obj = canvas.getActiveObject();
  if (!obj) return;

  canvas.remove(obj);
  canvas.discardActiveObject();
  canvas.renderAll();
  updatePropsPanel();
  pushHistory();
  scheduleAutoSave();
}

// ============ 幻灯片 CRUD ============
function addSlide() {
  const id = 'slide-' + Date.now();
  const newSlide = {
    id: id,
    layout: 'S03',
    theme: 'light',
    backgroundColor: '#fafaf8',
    animate: '',
    chrome: { left: '', right: '幻灯片 ' + (slidesData.slides.length + 1) },
    foot: { left: '', center: '', right: '' },
    content: {
      kicker: '',
      title: '新幻灯片',
      subtitle: '',
      lead: '',
      meta: []
    },
    images: [],
    video_url: '',
    custom_style: {},
    canvas_elements: []
  };
  slidesData.slides.push(newSlide);
  renderSlideList();
  selectSlide(id);
  scheduleAutoSave();
}

function deleteSlide(id) {
  const index = slidesData.slides.findIndex(s => String(s.id) === String(id));
  if (index === -1) return;

  slidesData.slides.splice(index, 1);

  if (String(selectedSlideId) === String(id)) {
    selectedSlideId = null;
    if (slidesData.slides.length > 0) {
      const newIndex = Math.min(index, slidesData.slides.length - 1);
      selectSlide(slidesData.slides[newIndex].id);
    } else {
      if (canvas) {
        canvas.clear();
        setCanvasBackground('#ffffff');
      }
      updatePropsPanel();
    }
  }

  renderSlideList();
  scheduleAutoSave();
}

function duplicateSlide(id) {
  if (selectedSlideId && canvas) {
    saveCurrentCanvasToSlide(selectedSlideId);
  }

  const index = slidesData.slides.findIndex(s => String(s.id) === String(id));
  if (index === -1) return;

  const originalSlide = slidesData.slides[index];
  const newSlide = JSON.parse(JSON.stringify(originalSlide));
  
  // 生成新的唯一 ID
  newSlide.id = 'slide-' + Date.now() + '-' + Math.floor(Math.random() * 1000);

  // 插入到当前幻灯片之后
  slidesData.slides.splice(index + 1, 0, newSlide);

  renderSlideList();
  selectSlide(newSlide.id);
  scheduleAutoSave();
}

// ============ 拖拽排序 ============
function onDragStart(e) {
  dragSrcIndex = parseInt(this.getAttribute('data-index'));
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragSrcIndex);
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}

// 预览当前所在位置的幻灯片
async function previewCurrentSlide(event) {
  if (event) {
    event.preventDefault();
  }
  // 先保存当前画布
  if (selectedSlideId && canvas) {
    saveCurrentCanvasToSlide(selectedSlideId);
  }
  await saveNow();

  const currentIdx = selectedSlideId ? slidesData.slides.findIndex(s => s.id === selectedSlideId) + 1 : 0;
  const url = currentIdx > 0 ? `/?slide=${currentIdx}` : '/';
  window.open(url, '_blank');
}

function onDragEnter(e) {
  e.preventDefault();
  this.classList.add('drag-over');
}

function onDragLeave() {
  this.classList.remove('drag-over');
}

function onDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  this.classList.remove('drag-over');

  const targetIndex = parseInt(this.getAttribute('data-index'));
  if (dragSrcIndex === null || dragSrcIndex === targetIndex) return;

  const moved = slidesData.slides.splice(dragSrcIndex, 1)[0];
  slidesData.slides.splice(targetIndex, 0, moved);

  renderSlideList();
  scheduleAutoSave();
}

function onDragEnd() {
  document.querySelectorAll('.slide-card').forEach(c => {
    c.classList.remove('dragging', 'drag-over');
  });
  dragSrcIndex = null;
}

// ============ 自动保存 & 手动保存 ============
function scheduleAutoSave() {
  if (autoSaveTimer) clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => saveNow(), 2000);
  updateSaveStatus('saving');
}

async function saveNow() {
  if (autoSaveTimer) { clearTimeout(autoSaveTimer); autoSaveTimer = null; }

  // 先将当前画布保存到当前 slide
  if (selectedSlideId && canvas) {
    saveCurrentCanvasToSlide(selectedSlideId);
  }

  updateSaveStatus('saving');

  try {
    const resp = await fetch('/api/slides', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(slidesData)
    });
    if (resp.ok) {
      const result = await resp.json();
      // 重新读取数据以获取服务端更新的版本号
      const freshData = await fetch('/api/slides').then(r => r.json());
      dataVersion = freshData._version || 0;
      updateSaveStatus('saved');
    } else {
      updateSaveStatus('error');
    }
  } catch (e) {
    updateSaveStatus('error');
  }
}

function updateSaveStatus(state) {
  const el = document.getElementById('saveStatus');
  const dot = document.getElementById('saveStatusDot');
  const text = document.getElementById('saveStatusText');

  el.className = 'save-status';
  if (state === 'saving') {
    el.classList.add('saving');
    dot.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>';
    text.textContent = '保存中...';
  } else if (state === 'saved') {
    el.classList.add('saved');
    dot.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    text.textContent = '已保存';
  } else {
    dot.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>';
    text.textContent = '保存失败';
  }
}

function getFontWeightNum(val) {
  if (!val) return 400;
  if (val === 'normal') return 400;
  if (val === 'bold') return 700;
  const num = parseInt(val);
  return isNaN(num) ? 400 : num;
}

function getFontWeightLabel(val) {
  const num = getFontWeightNum(val);
  const labels = {
    100: '100 (极细)',
    200: '200 (细)',
    300: '300 (偏细)',
    400: '400 (常规)',
    500: '500 (中等)',
    600: '600 (偏粗)',
    700: '700 (粗)',
    800: '800 (特粗)',
    900: '900 (极粗)'
  };
  return labels[num] || num;
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function rgbToHex(color) {
  if (!color) return '#000000';
  if (color.startsWith('#')) return color;
  // 处理 rgb() 格式
  const match = color.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if (match) {
    const r = parseInt(match[1]).toString(16).padStart(2, '0');
    const g = parseInt(match[2]).toString(16).padStart(2, '0');
    const b = parseInt(match[3]).toString(16).padStart(2, '0');
    return '#' + r + g + b;
  }
  return color;
}

function hexToColorInput(hex) {
  if (!hex || !hex.startsWith('#')) return hex;
  return hex;
}

function debounce(fn, delay) {
  let timer = null;
  return function(...args) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), delay);
  };
}

// ============ 外部修改检测 ============
async function checkDataVersion() {
  try {
    const resp = await fetch('/api/version');
    if (!resp.ok) return;
    const data = await resp.json();
    const serverVersion = data._version || 0;

    // 版本号不一致且服务端版本更新，说明数据被外部修改
    if (serverVersion > 0 && dataVersion > 0 && serverVersion !== dataVersion) {
      if (confirm('数据已被外部修改（如 Agent API 编辑），是否重新加载？\n\n点击"确定"重新加载（未保存的更改将丢失）\n点击"取消"继续编辑（可能覆盖外部修改）')) {
        await reloadFromServer();
      }
    }
  } catch (e) {
    // 静默失败，不影响编辑
  }
}

async function reloadFromServer() {
  try {
    const resp = await fetch('/api/slides');
    if (!resp.ok) return;
    slidesData = await resp.json();
    dataVersion = slidesData._version || 0;

    // 重新渲染幻灯片列表
    renderSlideList();

    // 重新加载当前选中的幻灯片
    if (selectedSlideId) {
      const exists = slidesData.slides.find(s => String(s.id) === String(selectedSlideId));
      if (exists) {
        await loadSlideToCanvas(selectedSlideId);
      } else {
        selectedSlideId = null;
        if (slidesData.slides.length > 0) {
          selectSlide(slidesData.slides[0].id);
        }
      }
    }

    updateStatusBar();
  } catch (e) {
    console.error('重新加载数据失败:', e);
  }
}

function showContextMenu(e, type, targetObj) {
  e.preventDefault();
  e.stopPropagation();

  let html;
  if (type === 'element' && targetObj) {
    const activeObj = canvas.getActiveObject();
    const isGroup = activeObj && activeObj.type === 'group';
    const isMultiSelect = activeObj && activeObj.type === 'activeSelection';
    html = getElementMenuItems(!!targetObj.lockMovementX, isGroup, isMultiSelect);
  } else {
    html = getBlankMenuItems();
  }

  ctxMenuEl.innerHTML = html;
  ctxMenuEl.style.display = 'block';

  let x = e.clientX;
  let y = e.clientY;
  const menuRect = ctxMenuEl.getBoundingClientRect();
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  if (x + menuRect.width > vw - 4) x = vw - menuRect.width - 4;
  if (y + menuRect.height > vh - 4) y = vh - menuRect.height - 4;
  if (x < 4) x = 4;
  if (y < 4) y = 4;

  ctxMenuEl.style.left = x + 'px';
  ctxMenuEl.style.top = y + 'px';
}

function hideContextMenu() {
  if (ctxMenuEl) ctxMenuEl.style.display = 'none';
}

function executeContextAction(action) {
  switch (action) {
    case 'paste': pasteClipboard(); break;
    case 'addText': addTextElement(); break;
    case 'addRect': addRectElement(); break;
    case 'addCircle': addCircleElement(); break;
    case 'addTriangle': addTriangleElement(); break;
    case 'selectAll': selectAllElements(); break;
    case 'duplicate': duplicateSelectedElement(); break;
    case 'copy': copySelectedElement(); break;
    case 'toggleLock': toggleSelectedLock(); break;
    case 'delete': deleteSelectedElement(); break;
    case 'bringForward': layerAction('bringForward'); break;
    case 'sendBackwards': layerAction('sendBackwards'); break;
    case 'centerOnCanvas': centerElementOnCanvas(); break;
    case 'groupElements': groupSelectedElements(); break;
    case 'ungroupElements': ungroupSelectedElement(); break;
  }
}

function handleCanvasContextMenu(e) {
  if (!canvas) return;
  const target = canvas.findTarget(e);

  if (target && !target.isAlignmentGuide) {
    const activeObj = canvas.getActiveObject();
    if (!activeObj || (activeObj.type === 'activeSelection' && !activeObj.contains(target)) || activeObj !== target) {
      canvas.setActiveObject(target);
      canvas.renderAll();
    }
    showContextMenu(e, 'element', target);
  } else {
    canvas.discardActiveObject();
    canvas.renderAll();
    showContextMenu(e, 'blank', null);
  }
}

ctxMenuEl.addEventListener('click', function(e) {

  if (!item || item.classList.contains('disabled')) return;
  const action = item.dataset.action;
  if (action) {
    executeContextAction(action);
    hideContextMenu();

});

function centerElementOnCanvas() {
  if (!canvas) return;
  const obj = canvas.getActiveObject();
  if (!obj) return;
  obj.set({
    left: (CANVAS_BASE_WIDTH - obj.width * obj.scaleX) / 2,
    top: (CANVAS_BASE_HEIGHT - obj.height * obj.scaleY) / 2
  });
  obj.setCoords();
  canvas.renderAll();
  pushHistory();
  scheduleAutoSave();
  updatePropsPanel();
}

function selectAllElements() {
  if (!canvas) return;
  const objects = canvas.getObjects().filter(function(obj) {
    return !obj.isAlignmentGuide && obj.selectable !== false;
  });
  if (objects.length === 0) return;
  canvas.discardActiveObject();
  if (objects.length === 1) {
    canvas.setActiveObject(objects[0]);
  } else {
    const sel = new fabric.ActiveSelection(objects, { canvas: canvas });
    canvas.setActiveObject(sel);
  }
  canvas.renderAll();
}

function groupSelectedElements() {
  if (!canvas) return;
  const activeObj = canvas.getActiveObject();
  if (!activeObj || activeObj.type !== 'activeSelection') return;

  const objects = activeObj.getObjects();
  if (objects.length < 2) return;

  activeObj.toGroup();
  canvas.requestRenderAll();
  pushHistory();
  scheduleAutoSave();
}

function ungroupSelectedElement() {
  if (!canvas) return;
  const activeObj = canvas.getActiveObject();
  if (!activeObj || activeObj.type !== 'group') return;

  activeObj.toActiveSelection();
  canvas.requestRenderAll();
  pushHistory();
  scheduleAutoSave();
}

// ============ 编组编辑模式 ============
let isGroupEditingMode = false;
let tempUngroupedGroup = null;
let tempUngroupedObjects = [];
let isSerializing = false;
let groupEditIndicator = null;

function isSelectionInsideGroupEditing(activeObj) {
  if (!activeObj || !isGroupEditingMode || !tempUngroupedObjects || tempUngroupedObjects.length === 0) return false;
  
  if (activeObj.type === 'activeSelection') {
    const selectedObjects = activeObj.getObjects();
    return selectedObjects.every(obj => tempUngroupedObjects.includes(obj));
  } else {
    return tempUngroupedObjects.includes(activeObj);
  }
}

function exitGroupEditMode(newActiveObject = null) {
  if (!isGroupEditingMode || !tempUngroupedGroup) return;
  
  isGroupEditingMode = false;
  
  // 结束文本编辑状态
  const activeObj = canvas.getActiveObject();
  if (activeObj && activeObj.isEditing) {
    activeObj.exitEditing();
  }
  
  let targetToSelect = newActiveObject;
  if (newActiveObject && newActiveObject.type === 'activeSelection') {
    const selectedObjs = newActiveObject.getObjects().slice();
    targetToSelect = {
      type: 'activeSelection',
      objects: selectedObjs
    };
  }
  
  const originalGroupInfo = tempUngroupedGroup;
  const originalObjects = tempUngroupedObjects;
  
  tempUngroupedGroup = null;
  tempUngroupedObjects = [];

  // 过滤出当前依旧在画布上的原始子元素
  const currentObjects = originalObjects.filter(obj => canvas.contains(obj));
  
  if (currentObjects.length > 0) {
    canvas.discardActiveObject();
    
    // 创建一个包含所有当前子元素的 ActiveSelection
    const sel = new fabric.ActiveSelection(currentObjects, { canvas: canvas });
    canvas.setActiveObject(sel);
    
    // 重新组合为 Group，还原原编组 ID 和锁定状态
    const group = sel.toGroup();
    group.id = originalGroupInfo.id;
    applyObjectLock(group, originalGroupInfo.locked);
    
    canvas.discardActiveObject();
    
    // 如果存在新的用户选择对象，将其设为活动对象；否则选择整个重新生成的组
    if (targetToSelect) {
      if (targetToSelect.type === 'activeSelection') {
        const activeSel = new fabric.ActiveSelection(targetToSelect.objects.filter(o => canvas.contains(o)), { canvas: canvas });
        canvas.setActiveObject(activeSel);
      } else if (canvas.contains(targetToSelect)) {
        canvas.setActiveObject(targetToSelect);
      }
    } else {
      canvas.setActiveObject(group);
    }
  } else if (targetToSelect) {
    canvas.discardActiveObject();
    if (targetToSelect.type === 'activeSelection') {
      const activeSel = new fabric.ActiveSelection(targetToSelect.objects.filter(o => canvas.contains(o)), { canvas: canvas });
      canvas.setActiveObject(activeSel);
    } else if (canvas.contains(targetToSelect)) {
      canvas.setActiveObject(targetToSelect);
    }
  }
  
  hideGroupEditIndicator();
  canvas.requestRenderAll();
  updatePropsPanel();
  
  pushHistory();
  scheduleAutoSave();
}

function showGroupEditIndicator() {
  const wrapper = document.getElementById('canvasWrapper');
  if (!wrapper) return;
  hideGroupEditIndicator();

  groupEditIndicator = document.createElement('div');
  groupEditIndicator.className = 'group-edit-indicator';
  groupEditIndicator.innerHTML = '&#x7F16;&#x7EC4;&#x7F16;&#x8F91;&#x6A21;&#x5F0F; &#x2022; ESC &#x9000;&#x51FA;';
  wrapper.style.position = 'relative';
  wrapper.appendChild(groupEditIndicator);
}

function hideGroupEditIndicator() {
  if (groupEditIndicator && groupEditIndicator.parentNode) {
    groupEditIndicator.parentNode.removeChild(groupEditIndicator);
  }
  groupEditIndicator = null;
}

function handleGroupEditDblClick(e) {
  if (!canvas) return;
  const target = canvas.findTarget(e);

  if (target && target.type === 'group' && !isGroupEditingMode) {
    e.preventDefault();
    const group = target;
    const originalId = group.id;
    const originalLocked = !!group.lockMovementX;
    const objects = group.getObjects().slice();
    
    // 将编组临时转换为 ActiveSelection 进行解组
    canvas.setActiveObject(group);
    const activeSel = group.toActiveSelection();
    canvas.requestRenderAll();
    
    // 清除当前的 ActiveSelection 选中状态，避免其作为一个整体拦截 findTarget 搜索，从而正确定位到具体点击的单个子对象。
    canvas.discardActiveObject();
    
    // 在解组后的顶层元素中重新定位鼠标双击所在的那个子元素
    const clickedSubObject = canvas.findTarget(e);
    
    tempUngroupedGroup = {
      id: originalId,
      locked: originalLocked
    };
    tempUngroupedObjects = objects;
    isGroupEditingMode = true;
    
    if (clickedSubObject && objects.includes(clickedSubObject)) {
      canvas.setActiveObject(clickedSubObject);
      if (clickedSubObject.type === 'i-text' || clickedSubObject.type === 'textbox') {
        clickedSubObject.enterEditing();
      }
    } else if (objects.length > 0) {
      canvas.setActiveObject(objects[0]);
    }
    
    canvas.requestRenderAll();
    showGroupEditIndicator();
    updatePropsPanel();
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (isGroupEditingMode) {
      e.preventDefault();
      exitGroupEditMode();
      return;
    }
    hideContextMenu();
  }
});
</script>
